<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hawker Heroes - Tony &amp; Terrance</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1a130d;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #game {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas {
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }
    #hint {
      position: fixed;
      bottom: 6px;
      left: 0;
      right: 0;
      text-align: center;
      color: #6b5a45;
      font-size: 12px;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="hint">Hawker Heroes - M: mute &nbsp;•&nbsp; Esc: menu &nbsp;•&nbsp; gamepads supported</div>

  <!-- Engine (vendored, works offline) -->
  <script src="vendor/phaser.min.js"></script>

  <!-- Game source. Order matters: data/config first, scenes last. -->
  <script src="src/config.js"></script>
  <script src="src/data.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/textures.js"></script>
  <script src="src/input.js"></script>
  <script src="src/bot.js"></script>
  <script src="src/entities/stall.js"></script>
  <script src="src/entities/customer.js"></script>
  <script src="src/entities/player.js"></script>
  <script src="src/entities/npc.js"></script>
  <script src="src/ui/hud.js"></script>

  <!-- Higher-detail cute art (optional drop-in override; procedural art is the fallback) -->
  <script src="src/art/cute.js"></script>
  <!-- Generated raster image sprites (override cute.js where present) -->
  <script src="src/art/sprites.js"></script>

  <script src="src/scenes/boot.js"></script>
  <script src="src/scenes/menu.js"></script>
  <script src="src/scenes/game.js"></script>
  <script src="src/scenes/gameover.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
